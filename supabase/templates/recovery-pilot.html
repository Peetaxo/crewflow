<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><title>Nové heslo do nodu — místní test</title></head>
<body style="font-family:Arial,sans-serif;line-height:1.6;max-width:560px;margin:32px auto;padding:16px;color:#172025">
  <h1>Nastavení nového hesla</h1>
  <p>Požádal/a jsi o změnu hesla do nodu. Odkaz platí <strong>1 hodinu</strong>.</p>
  <p><a href="nodu-test://reset-password#token_hash={{ .TokenHash }}">Otevřít v testovací mobilní aplikaci</a></p>

  <p>Pokud jsi o změnu nežádal/a, tento e-mail můžeš ignorovat.</p>
  <p style="font-size:12px;color:#667">Jde o místní testovací e-mail. Šablona je určena pouze pro oddělený pilot.</p>
</body>
