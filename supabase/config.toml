[functions.generate-invoice-pdf]
verify_jwt = true
static_files = ["./functions/generate-invoice-pdf/assets/*"]

[functions.upload-invoice-document]
verify_jwt = true

[functions.process-invoice-pdfs]
# Custom server-only secret protects this existing processor.
verify_jwt = false
static_files = ["./functions/generate-invoice-pdf/assets/*"]

[functions.crew-onboarding]
# The invitation token is the capability; every SQL helper remains service-role-only.
verify_jwt = false

[functions.send-notifications]
# Authenticated inside the function using a server-owned, rotated private worker secret.
verify_jwt = false
